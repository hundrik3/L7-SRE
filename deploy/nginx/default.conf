server {
    listen 80;
    server_name _;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location = /fail {
        return 503 "backend failure\n";
    }

    location / {
        default_type text/plain;
        add_header X-Backend $hostname always;
        return 200 "$hostname\n";
    }
}

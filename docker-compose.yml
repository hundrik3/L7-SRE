services:
  lb:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      BACKENDS: http://backend1:80,http://backend2:80,http://backend3:80
      BALANCER_STRATEGY: ${BALANCER_STRATEGY:-round_robin}
      HEALTH_INTERVAL: 2s
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # Keep internal traffic off any inherited development proxy.
      NO_PROXY: backend1,backend2,backend3,localhost,127.0.0.1
      no_proxy: backend1,backend2,backend3,localhost,127.0.0.1
    depends_on:
      backend1: {condition: service_healthy}
      backend2: {condition: service_healthy}
      backend3: {condition: service_healthy}
    stop_grace_period: 30s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  backend1:
    image: nginx:1.28-alpine
    hostname: backend1
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 2s
      timeout: 1s
      retries: 5

  backend2:
    image: nginx:1.28-alpine
    hostname: backend2
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 2s
      timeout: 1s
      retries: 5

  backend3:
    image: nginx:1.28-alpine
    hostname: backend3
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 2s
      timeout: 1s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    environment:
      NO_PROXY: lb,localhost,127.0.0.1
      no_proxy: lb,localhost,127.0.0.1
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      lb: {condition: service_healthy}
